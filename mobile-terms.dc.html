<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mobile terms of service | 48th Legislative District Democrats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta property="og:title" content="Mobile terms of service | 48th Legislative District Democrats"/>
<meta property="og:description" content="Terms for the SMS text messaging program of the 48th Legislative District Democrats."/>
<meta property="og:image" content="assets/ld48-emblem.png"/>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:#fff}a{color:#0267BD}a:hover{color:#0BA5E9}a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #0BA5E9;outline-offset:2px}</style>
</helmet>
<div style="font-family:'Libre Franklin',system-ui,sans-serif;color:#102a43;background:#fff">

  <dc-import name="nav" current="" hint-size="100%,74px"></dc-import>

  <section id="main-content" style="background:#011D3E;color:#fff;padding:clamp(48px,7vw,84px) 24px">
    <div style="max-width:820px;margin:0 auto">
      <p style="font-family:'Archivo',sans-serif;text-transform:uppercase;letter-spacing:1.5px;font-size:14px;font-weight:700;color:#63A434;margin:0 0 14px">About</p>
      <h1 style="font-family:'Archivo',sans-serif;font-weight:900;font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-1px;margin:0 0 16px">Mobile terms of service</h1>
      <p style="font-size:16px;color:#9FC6E6;margin:0">Last updated June 2026</p>
    </div>
  </section>

  <section style="background:#fff;padding:clamp(44px,6vw,72px) 24px">
    <div style="max-width:820px;margin:0 auto">
      <p style="font-size:18px;line-height:1.7;color:#3a546e;margin:0 0 36px">These terms govern the SMS text messaging program of the 48th Legislative District Democrats. By opting in, you agree to these terms.</p>
      <sc-for list="{{ sections }}" as="s" hint-placeholder-count="6">
        <div style="margin-bottom:32px">
          <h2 style="font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(21px,2.6vw,26px);margin:0 0 12px;color:#011D3E">{{ s.h }}</h2>
          <sc-for list="{{ s.p }}" as="para" hint-placeholder-count="2">
            <p style="font-size:17px;line-height:1.7;color:#3a546e;margin:0 0 12px">{{ para }}</p>
          </sc-for>
        </div>
      </sc-for>
      <div style="border-top:1px solid #e2ecf5;padding-top:24px;font-size:17px;line-height:1.7;color:#3a546e">See also our <a href="privacy.dc.html" style="color:#0267BD;font-weight:600">Privacy policy</a>. Questions? Visit <a href="https://scaletowin.com/" target="_blank" rel="noopener" style="color:#0267BD;font-weight:600">Scale to Win</a>.</div>
    </div>
  </section>

  <dc-import name="footer" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:760}}">
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { h: 'Program description', p: ['When you opt in, the 48th Legislative District Democrats will send recurring text messages including updates, event invitations, donation asks, and voting reminders.'] },
        { h: 'Message frequency', p: ['You may receive up to 2 text messages per day. Frequency may vary based on events and the election calendar.'] },
        { h: 'Cost', p: ['Message and data rates may apply. These charges come from your mobile carrier and are your responsibility. We do not charge for the messages themselves.'] },
        { h: 'How to opt in', p: ['You opt in by submitting our SMS sign-up form and checking the consent box, or by texting our published keyword. Consent is not a condition of any purchase or membership.'] },
        { h: 'How to get help', p: ['Text HELP at any time for assistance. Program support is provided through Scale to Win at scaletowin.com.'] },
        { h: 'How to opt out', p: ['Text STOP at any time to stop receiving messages. You will receive one confirmation message and then no further texts unless you opt in again.'] },
        { h: 'Carriers and delivery', p: ['Carriers are not liable for delayed or undelivered messages. Supported carriers may change without notice.'] },
        { h: 'Privacy', p: ['Your mobile information is handled according to our Privacy policy and is never sold or shared with third parties for their marketing.'] },
      ],
    };
  }
}
</script>
</body>
</html>
